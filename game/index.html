<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wasteland Survivor</title>
<link rel="icon" href="https://d8j0ntlcm91z4.cloudfront.net/user_3HI9gs6RQRwUiu31B6zzxWQryLj/hf_20260803_012157_b0de0b00-868b-4cc1-916d-fbe9b4d471a5.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f1117;-webkit-user-select:none;user-select:none;touch-action:none;font-family:-apple-system,Helvetica,Arial,sans-serif;}
  canvas{display:block;position:absolute;top:0;left:0;}
  #dev{position:fixed;top:4px;left:4px;color:#0f0;font:12px monospace;display:none;z-index:50;pointer-events:none;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8e2d6;text-align:center;z-index:20;}
  #overlay.hidden{display:none;}
  .panel{background:rgba(10,12,10,0.78);border:2px solid #3a4a2f;border-radius:14px;padding:28px 34px;max-width:90vw;box-sizing:border-box;}
  h1{font-size:clamp(24px,6vw,44px);letter-spacing:2px;color:#e8b93a;margin:0 0 6px;text-shadow:0 2px 0 #000;}
  h2{font-size:clamp(16px,4vw,22px);color:#8fae5a;margin:0 0 18px;font-weight:400;}
  .btn{display:inline-block;margin-top:14px;padding:14px 30px;background:#3d6b2c;color:#fff;border:2px solid #6fa83f;border-radius:10px;font-size:clamp(15px,4vw,20px);font-weight:bold;letter-spacing:1px;cursor:pointer;}
  .btn:active{background:#5a8f3e;}
  .small{font-size:13px;color:#9a9a8f;margin-top:10px;line-height:1.5;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:inherit;}
  #hpwrap{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px;width:min(46vw,220px);}
  #hpbar{height:16px;border:2px solid #1c1c1c;border-radius:8px;background:#241f1a;overflow:hidden;}
  #hpfill{height:100%;width:100%;background:linear-gradient(#e35b4a,#a5301f);transition:width .15s;}
  #hplabel{color:#f0e9da;font-size:11px;margin-top:2px;text-shadow:0 1px 2px #000;}
  #topright{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;text-align:right;color:#f0e9da;text-shadow:0 1px 2px #000;font-size:13px;}
  #wavelabel{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#e8b93a;font-weight:bold;text-shadow:0 1px 2px #000;font-size:14px;}
  #pausebtn,#mutebtn{pointer-events:auto;position:absolute;top:calc(46px + env(safe-area-inset-top));right:14px;width:34px;height:34px;background:rgba(20,20,20,.6);border:1px solid #555;border-radius:8px;color:#eee;text-align:center;line-height:34px;font-size:16px;}
  #mutebtn{right:56px;}
  #hint{position:absolute;bottom:22vh;left:50%;transform:translateX(-50%);color:#e8e2d6;font-size:13px;text-align:center;text-shadow:0 1px 3px #000;opacity:1;transition:opacity 1s;width:80vw;}
  #stick-l,#stick-r{pointer-events:auto;position:absolute;bottom:max(20px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.18);}
  #stick-l{left:20px;}
  #stick-r{right:20px;}
  .knob{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:rgba(232,185,58,0.35);border:2px solid rgba(232,185,58,0.7);}
  #dashbtn{pointer-events:auto;position:absolute;right:34px;bottom:160px;width:70px;height:70px;border-radius:50%;background:rgba(61,107,44,.55);border:2px solid #6fa83f;color:#fff;font-size:11px;font-weight:bold;text-align:center;line-height:70px;}
  #dashbtn.cd{opacity:.35;}
  #upgrades{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .card{pointer-events:auto;cursor:pointer;background:#1c2415;border:2px solid #4a5e34;border-radius:10px;padding:14px 10px;width:150px;color:#e8e2d6;font-size:13px;white-space:pre-line;line-height:1.4;}
  .card:active{background:#2c3a1c;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dev"></div>

<div id="hud">
  <div id="hpwrap"><div id="hpbar"><div id="hpfill"></div></div><div id="hplabel"></div></div>
  <div id="wavelabel"></div>
  <div id="topright"></div>
  <div id="pausebtn">II</div>
  <div id="mutebtn">♪</div>
  <div id="hint"></div>
  <div id="stick-l"><div class="knob" id="knob-l"></div></div>
  <div id="stick-r"><div class="knob" id="knob-r"></div></div>
  <div id="dashbtn"></div>
</div>

<div id="overlay">
  <div class="panel" id="panel-menu">
    <h1></h1>
    <h2></h2>
    <div class="btn" id="btn-start"></div>
    <div class="small" id="menu-best"></div>
  </div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
