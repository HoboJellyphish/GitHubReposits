name: Build Android Debug APK (for testers)

on:
  push:
    branches: [main]
    paths:
      - "family-health-tracker/**"
      - ".github/workflows/build-android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-health-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-health-tracker/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Debug builds are auto-signed with Android's built-in debug
      # keystore, so this needs none of the Play Store signing secrets.
      # Not for Play Store upload — for installing directly on a test
      # device (sideload) or sharing with testers ad hoc.
      - name: Build debug APK
        working-directory: family-health-tracker/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-health-tracker-debug-apk
          path: family-health-tracker/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk family-health-tracker-debug.apk
        working-directory: family-health-tracker

      # Publishes/updates a single, always-current pre-release with a fixed
      # tag so testers get one stable download link instead of having to
      # find a specific workflow run's Artifacts section each time.
      - name: Publish test build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test-build
          name: Latest Test Build
          body: |
            Automatically updated test build of Family Health Tracker — always the most recent build from the `claude/family-health-tracker-sq1u3p` branch.

            Download `family-health-tracker-debug.apk` below and install it directly on an Android device. This is a debug build for testing only, not a Play Store release.
          prerelease: true
          files: family-health-tracker/family-health-tracker-debug.apk
